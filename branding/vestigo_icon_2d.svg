<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtro de resplandor sutil 2D para bordes de luminol -->
    <filter id="neon2d" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradiente de fondo 2D -->
    <linearGradient id="bg2d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Gradiente cian neón principal para la 'V' -->
    <linearGradient id="vCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gradiente para el núcleo de la huella -->
    <linearGradient id="fingerprintGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- FONDO SQUIRCLE PLANO 2D (ESTÁNDAR iOS / ANDROID ADAPTIVE) -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bg2d)" />
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#1e293b" stroke-width="2.5" />

  <!-- RETÍCULA TÁCTICA DE FONDO 2D -->
  <!-- Ejes cartesianos sutiles -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />
  <line x1="40" y1="256" x2="472" y2="256" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />
  
  <!-- Círculos de radar concéntricos -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.4" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4,6" opacity="0.35" />

  <!-- HUELLA DACTILAR BIOMÉTRICA (CRESTAS CONCÉNTRICAS EN 2D) -->
  <g fill="none" stroke="url(#fingerprintGrad)" stroke-linecap="round" opacity="0.85">
    <!-- Cresta interior 1 -->
    <path d="M 238 235 C 238 215, 274 215, 274 235 L 274 270" stroke-width="3" />
    <!-- Cresta 2 -->
    <path d="M 224 235 C 224 195, 288 195, 288 235 L 288 290" stroke-width="3.5" />
    <!-- Cresta 3 -->
    <path d="M 208 235 C 208 175, 304 175, 304 235 L 304 310" stroke-width="3.5" />
    <!-- Cresta 4 -->
    <path d="M 190 235 C 190 152, 322 152, 322 235 L 322 332" stroke-width="4" stroke-dasharray="24,6" />
    <!-- Cresta 5 -->
    <path d="M 170 235 C 170 128, 342 128, 342 235 L 342 355" stroke-width="4" stroke-dasharray="32,8" opacity="0.6" />
    <!-- Cresta 6 (exterior tenue) -->
    <path d="M 148 235 C 148 102, 364 102, 364 235" stroke-width="3.5" stroke-dasharray="16,8" opacity="0.3" />
  </g>

  <!-- RETÍCULA TÁCTICA FORENSE (MIRA CENTRAL) -->
  <g stroke="#00e5ff" stroke-width="2" fill="none" filter="url(#neon2d)">
    <!-- Marcas angulares de enfoque pericial -->
    <path d="M 220 180 L 195 180 L 195 205" />
    <path d="M 292 180 L 317 180 L 317 205" />
    <path d="M 195 307 L 195 332 L 220 332" />
    <path d="M 317 307 L 317 332 L 292 332" />
  </g>

  <!-- MONOGRAMA 'V' PLANO 2D (SÍMBOLO PRINCIPAL DE LA APP) -->
  <g filter="url(#neon2d)">
    <!-- Silueta principal de la 'V' en líneas limpias y gruesas -->
    <path d="M 108 120 L 256 392 L 404 120 L 344 120 L 256 288 L 168 120 Z" 
          fill="url(#vCyanGrad)" />

    <!-- Filete interior de alto contraste -->
    <path d="M 128 132 L 256 372 L 384 132 L 348 132 L 256 304 L 164 132 Z" 
          fill="#ffffff" opacity="0.25" />
  </g>

  <!-- VÉRTICE DE PRECISIÓN / HAZ DE LUMINOL -->
  <circle cx="256" cy="392" r="6" fill="#ffffff" filter="url(#neon2d)" />
  <circle cx="256" cy="392" r="14" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.8" />

  <!-- CENTRO DE RETÍCULA (PUNTERO DE DIANA) -->
  <circle cx="256" cy="256" r="3" fill="#ff2d55" />
  <circle cx="256" cy="256" r="8" fill="none" stroke="#ff2d55" stroke-width="1.5" opacity="0.75" />
</svg>
