<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="wmCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="wmLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <filter id="wmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- FONDO NEGRO OBSIDIANA -->
  <rect width="900" height="240" rx="20" fill="#06090e" stroke="#1e293b" stroke-width="1.5" />

  <!-- SÍMBOLO MONOGRAMA VESTIGO A LA IZQUIERDA -->
  <g transform="translate(40, 20)">
    <!-- Squircle contenedor del icono -->
    <rect x="0" y="0" width="200" height="200" rx="46" fill="#0b1120" stroke="#1e293b" stroke-width="2" />

    <!-- Retícula y marcas -->
    <circle cx="100" cy="100" r="70" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4,6" opacity="0.3" />
    <path d="M 50 80 C 80 50, 120 50, 150 80" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,3" />

    <!-- Monograma V -->
    <path d="M 45 48 L 100 152 L 100 118 L 68 48 Z" fill="url(#wmLeftGrad)" />
    <path d="M 155 48 L 100 152 L 100 118 L 132 48 Z" fill="url(#wmCyan)" filter="url(#wmGlow)" />
    <polygon points="100,110 76,58 124,58" fill="#070b14" />

    <!-- Vértice radiante -->
    <line x1="100" y1="65" x2="100" y2="152" stroke="#ffffff" stroke-width="2" stroke-linecap="round" filter="url(#wmGlow)" />
    <circle cx="100" cy="152" r="5" fill="#ffffff" filter="url(#wmGlow)" />
    <circle cx="100" cy="88" r="2.5" fill="#ff2d55" filter="url(#wmGlow)" />
  </g>

  <!-- TIPOGRAFÍA / WORDMARK PRINCIPAL -->
  <g transform="translate(280, 125)">
    <!-- Letras 'VESTIGO' -->
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="76" font-weight="900" letter-spacing="14">
      VESTIG<tspan fill="#00e5ff" filter="url(#wmGlow)">O</tspan>
    </text>

    <!-- Subtítulo de categoría / Descriptor de producto -->
    <text x="4" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Courier Prime', monospace" font-size="14" font-weight="700" letter-spacing="5">
      FORENSIC INVESTIGATION SYSTEM
    </text>

    <!-- Línea acento cian -->
    <line x1="4" y1="52" x2="480" y2="52" stroke="#1e293b" stroke-width="2" />
    <line x1="4" y1="52" x2="140" y2="52" stroke="#00e5ff" stroke-width="2" filter="url(#wmGlow)" />
  </g>
</svg>
