<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VESTIGO — Mobile Touch Simulator (iPhone Pro 393x852)</title>
  <link rel="icon" type="image/png" href="imagenes/vestigo_icon_2d.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020408;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
    }
    .simulator-bar {
      width: 100%;
      background: rgba(11, 17, 32, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      font-family: 'Courier Prime', monospace;
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 9999;
    }
    .simulator-title { color: #00e5ff; font-weight: 700; }
    .simulator-actions { display: flex; gap: 10px; align-items: center; }
    .sim-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 14px;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .sim-btn:hover { background: rgba(0, 229, 255, 0.2); border-color: #00e5ff; }
    .mobile-stage-wrap {
      padding: 30px 20px 60px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .iphone-frame {
      width: 393px;
      height: 852px;
      border-radius: 54px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 10px #1a2233, 0 30px 90px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 229, 255, 0.15);
      overflow: hidden;
      position: relative;
      background: #04070D;
      display: flex;
      flex-direction: column;
    }
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      z-index: 5000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }
    .dynamic-island-camera {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #090e1a;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .dynamic-island-sensor {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #040810;
    }
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 4px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 2px;
      z-index: 5000;
      pointer-events: none;
    }
    .iphone-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #04070D;
    }
    .iphone-viewport iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #04070D;
    }
    @media (max-width: 768px) {
      .simulator-bar { display: none; }
      .mobile-stage-wrap { padding: 0; }
      .iphone-frame {
        width: 100vw;
        height: 100dvh;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
      .dynamic-island, .home-indicator { display: none; }
    }
  </style>
</head>
<body>

  <!-- DESKTOP SIMULATOR TOPBAR -->
  <div class="simulator-bar">
    <div>
      <span class="simulator-title">VESTIGO MOBILE UX SIMULATOR</span> // iPhone 14/15/16 Pro (393 × 852 pt)
    </div>
    <div class="simulator-actions">
      <span>Dynamic Island Check: Activo</span>
      <a href="index.html" class="sim-btn">
        <span>Abrir App Completa ↗</span>
      </a>
    </div>
  </div>

  <div class="mobile-stage-wrap">
    <div class="iphone-frame">
      <!-- Simulated Apple Dynamic Island -->
      <div class="dynamic-island">
        <div class="dynamic-island-sensor"></div>
        <div class="dynamic-island-camera"></div>
      </div>

      <!-- Simulated iOS Home Indicator -->
      <div class="home-indicator"></div>

      <!-- Viewport running production index.html -->
      <div class="iphone-viewport">
        <iframe src="index.html" title="VESTIGO Mobile Experience"></iframe>
      </div>
    </div>
  </div>

</body>
</html>
